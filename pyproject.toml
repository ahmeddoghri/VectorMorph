[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vectormorph"
version = "0.2.0"
description = "Interpolate one SVG shape into another and export it as an animated SVG, WebP, GIF, or APNG"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ahmed Doghri" }]
keywords = ["svg", "animation", "morphing", "interpolation", "vector", "webp", "gif"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]

# The morph engine and the animated-SVG export are pure Python. Rasterizing to
# WebP/GIF/APNG needs [raster]; the web studio needs [web].
dependencies = ["defusedxml>=0.7.1"]

[project.optional-dependencies]
raster = ["Pillow>=10.2.0", "CairoSVG>=2.7.1"]
web = ["Flask>=3.0.0", "Flask-SocketIO>=5.3.6", "Pillow>=10.2.0", "CairoSVG>=2.7.1"]
dev = [
    "pytest>=8.0",
    "Pillow>=10.2.0",
    "CairoSVG>=2.7.1",
    "Flask>=3.0.0",
    "Flask-SocketIO>=5.3.6",
]

[project.scripts]
vectormorph = "vectormorph.cli:main"

[project.urls]
Homepage = "https://github.com/ahmeddoghri/VectorMorph"

[tool.setuptools]
packages = ["vectormorph"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
python_files = ["test_*.py"]
