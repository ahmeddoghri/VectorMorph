name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system dependencies (CairoSVG needs libcairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: pytest -q

  engine-only:
    # The morph engine and animated-SVG export must work with no libcairo and
    # no Pillow, so the library stays usable as a pure-Python dependency.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the engine alone
        run: pip install defusedxml
      - name: Morph without any raster dependency
        run: |
          python -m vectormorph.cli morph examples/circle.svg examples/star.svg -o /tmp/out.svg
          python -m vectormorph.cli inspect examples/heart.svg
          test -s /tmp/out.svg

  benchmark:
    # The committed benchmark.json must match what the code actually produces.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the engine
        run: pip install defusedxml
      - name: Regenerate and diff the benchmark artifact
        run: |
          python -m vectormorph.bench --json /tmp/benchmark.json
          diff -u benchmark.json /tmp/benchmark.json
